[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptdu"
version = "0.1.0"
description = "Python Tkinter Disk Usage analyzer - an ncdu-like tool with vim keybindings"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Cosme Zamudio"}]
keywords = ["disk", "usage", "analyzer", "ncdu", "tkinter", "vim", "tui"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "send2trash>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/cosmez/ptdu"
Repository = "https://github.com/cosmez/ptdu"
Issues = "https://github.com/cosmez/ptdu/issues"

[project.scripts]
ptdu = "ptdu.main:main"

[tool.hatch.build.targets.wheel]
packages = ["ptdu"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = [
    "docs/.*\\.md$",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
